# ============================================================
#  xiaoxu-xiaofu.top · www.xiaoxu-xiaofu.top
#  小站 Nginx 配置 —— Node 服务监听 127.0.0.1:3000
#
#  安装位置：/etc/nginx/conf.d/xiaoxu-xiaofu.conf
#  校验生效：nginx -t && systemctl reload nginx
#
#  使用方式：
#  A) 还没有 HTTPS 证书（推荐流程）：
#     直接使用下面的【阶段一】配置，然后执行：
#       certbot --nginx -d xiaoxu-xiaofu.top -d www.xiaoxu-xiaofu.top
#     certbot 会自动签发证书、加上 443 配置，并把 80 段改成 301 跳转 HTTPS。
#  B) 已有证书（如云厂商免费证书）：
#     把下方注释掉的 HTTPS 配置取消注释，ssl_certificate 两行换成
#     你的 .pem / .key 实际路径，并把阶段一的 80 段改为：
#       return 301 https://$host$request_uri;
# ============================================================

# ---------- 阶段一：HTTP（现在就能用，证书签发前保持这样） ----------
server {
    listen 80;
    listen [::]:80;
    server_name xiaoxu-xiaofu.top www.xiaoxu-xiaofu.top;

    # 后台上传图片走 base64（最大约 12MB），这里留足余量
    client_max_body_size 16m;

    # 文本类内容压缩，加快加载
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

