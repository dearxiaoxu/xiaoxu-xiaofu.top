<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F7FA">
  <meta name="theme-color" content="#14171C" media="(prefers-color-scheme: dark)">
  <title>我的足迹 · xiaoxu & xiaofu</title>
  <meta name="description" content="记录走过的城市，也记录那些城市里的故事。">
  <meta property="og:title" content="我的足迹 · xiaoxu & xiaofu">
  <meta property="og:description" content="记录走过的城市，也记录那些城市里的故事。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.xiaoxu-xiaofu.top/cities.html">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="canonical" href="https://www.xiaoxu-xiaofu.top/cities.html">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cities">
  <main class="trip-page">
    <div class="trip-layout">
      <aside class="trip-col trip-timeline-col">
        <button class="trip-drawer-close" id="trip-timeline-close" type="button" aria-label="关闭时间轴">✕</button>
        <div class="trip-col-head">
          <h2>旅行时间轴</h2>
          <p>把走过的城市，串成一段属于自己的旅程。</p>
        </div>
        <div class="trip-timeline" id="trip-timeline"></div>
      </aside>

      <section class="trip-col trip-map-col">
        <div class="trip-map" id="trip-map"></div>
        <div class="trip-overlay">
          <a class="trip-back" href="index.html">← 首页</a>
          <div class="trip-filters" id="trip-filters" role="tablist" aria-label="按年份筛选"></div>
        </div>
        <button class="trip-play" id="trip-play" type="button" aria-pressed="false">▶ 播放我的旅程</button>
        <button class="trip-panel-toggle trip-panel-toggle-left" id="trip-toggle-left" type="button" aria-label="收起时间轴">‹</button>
        <button class="trip-panel-toggle trip-panel-toggle-right" id="trip-toggle-right" type="button" aria-label="收起详情">›</button>
      </section>

      <aside class="trip-col trip-detail-col">
        <button class="trip-drawer-close" id="trip-detail-close" type="button" aria-label="关闭详情">✕</button>
        <div class="trip-detail" id="trip-detail"></div>
      </aside>
    </div>

    <div class="trip-backdrop" id="trip-backdrop"></div>
    <footer class="trip-stats" id="trip-stats"></footer>
  </main>

  <script src="js/main.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
