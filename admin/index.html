<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>管理后台 · xiaoxu & xiaofu</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- ============ 登录视图 ============ -->
  <div id="login-view" hidden>
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-mark">🧡</div>
        <h1 class="login-title">内容管理后台</h1>
        <p class="login-sub">xiaoxu &amp; xiaofu · 站点内容编辑</p>
        <form id="login-form" autocomplete="off">
          <label class="f-label" for="login-password">管理密码</label>
          <input type="password" id="login-password" class="login-input" placeholder="输入管理密码" autocomplete="current-password">
          <button type="submit" id="login-btn" class="btn btn-primary btn-block">登 录</button>
        </form>
        <p class="login-msg" id="login-msg">正在连接服务…</p>
      </div>
    </div>
  </div>

  <!-- ============ 后台主视图 ============ -->
  <div id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">🧡</span>
        <span class="brand-text">管理后台</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">xiaoxu &amp; xiaofu</div>
    </aside>
    <div class="sidebar-backdrop" id="backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="菜单">☰</button>
        <h1 class="page-title" id="page-title">站点设置</h1>
        <div class="topbar-right">
          <span class="site-name" id="site-name">…</span>
          <button class="btn btn-ghost btn-sm" id="logout-btn">退出登录</button>
        </div>
      </header>

      <main class="view" id="view"></main>

      <footer class="save-bar">
        <span class="dirty" id="dirty-label">所有修改已保存</span>
        <button class="btn btn-primary" id="save-btn">保存修改</button>
      </footer>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
